[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcoder-repoexec"
version = "0.1.0"
description = "SMARTCoder experimental code package for RepoExec."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "httpx>=0.27.0",
  "openai>=1.30.0",
  "pandas>=2.0.0",
  "pyarrow>=14.0.0",
]

[project.scripts]
smartcoder = "smartcoder.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
smartcoder = ["data/*.jsonl"]
